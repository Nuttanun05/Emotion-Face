{% extends "base.html" %}
{% block title %}สมัครสมาชิก · Emotion Face{% endblock %}
{% block content %}
<main class="auth">
  <div class="auth-emoji" aria-hidden="true">😗</div>
  <h1>สมัครสมาชิก</h1>
  <form method="post">
    <label>ชื่อผู้ใช้ (a-z, 0-9, _ ยาว 3-20) <input name="username" autocomplete="username" required autofocus></label>
    <label>รหัสผ่าน (อย่างน้อย 6 ตัว) <input name="password" type="password" autocomplete="new-password" required></label>
    <label>ยืนยันรหัสผ่าน <input name="confirm" type="password" autocomplete="new-password" required></label>
    <button class="btn" type="submit">สมัครสมาชิก</button>
  </form>
  <p class="alt">มีบัญชีแล้ว? <a href="{{ url_for('login') }}">เข้าสู่ระบบ</a></p>
</main>
{% endblock %}
